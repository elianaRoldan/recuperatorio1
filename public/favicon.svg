<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#2D5A27" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AB800" />
      <stop offset="100%" stop-color="#2D5A27" />
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28E2B" />
      <stop offset="100%" stop-color="#E15759" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#F7F3EE" stroke="#2D5A27" stroke-width="3"/>
  <!-- Mountain silhouette -->
  <path d="M12 75 L35 44 L47 57 L65 32 L88 75 Z" fill="url(#mountGrad)"/>
  <!-- Snow caps -->
  <path d="M35 44 L40 51 L35 54 L30 50 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M65 32 L72 43 L66 47 L61 41 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Valley lake line -->
  <path d="M12 75 Q50 82 88 75 L88 82 Q50 90 12 82 Z" fill="#1B365D" opacity="0.3"/>
  <!-- Organic Leaves (Twin Leaves Motif) -->
  <path d="M50 42 C45 28 32 24 24 30 C22 42 36 50 50 42 Z" fill="url(#leafGrad)"/>
  <path d="M50 42 C55 28 68 24 76 30 C78 42 64 50 50 42 Z" fill="url(#leafGrad)"/>
  <!-- Central Fruit dot/accent -->
  <circle cx="50" cy="40" r="4.5" fill="url(#peachGrad)"/>
